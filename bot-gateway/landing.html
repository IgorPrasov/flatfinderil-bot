<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d0d0d;color:#fff;min-height:100vh}
body.rtl{direction:rtl}
a{text-decoration:none;color:inherit}

.lang-bar{display:flex;justify-content:flex-end;padding:16px 24px 0;gap:6px}
body.rtl .lang-bar{justify-content:flex-start}
.lang-btn{background:#1a1a1a;border:1px solid #444;border-radius:8px;color:#bbb;font-size:13px;font-weight:600;padding:6px 14px;cursor:pointer;transition:all .15s;letter-spacing:.04em;font-family:inherit}
.lang-btn:hover{border-color:#777;color:#fff;background:#252525}
.lang-btn.active{border-color:#2563EB;color:#fff;background:#2563EB}

.container{max-width:680px;margin:0 auto;padding:0 20px}
.hero{text-align:center;padding:44px 20px 34px}
.logo-wrap{display:inline-flex;align-items:center;gap:12px;margin-bottom:22px}
.logo-box{width:64px;height:64px;background:#2563EB;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;flex-shrink:0}
.logo-img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex-shrink:0}
.logo-name{font-size:28px;font-weight:700;color:#fff}
.logo-name span{color:#2563EB}
.logo-sub{font-size:12px;color:#555;margin-top:3px;letter-spacing:.06em;text-align:left}
body.rtl .logo-sub{text-align:right}

h1{font-size:clamp(28px,6vw,50px);font-weight:800;line-height:1.15;color:#fff;margin-bottom:18px}
h1 .hl{color:#2563EB}
.hero-desc{font-size:16px;color:#aaa;line-height:1.65;max-width:520px;margin:0 auto 30px}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px}
.feat{background:#181818;border:1px solid #252525;border-radius:16px;padding:20px 14px;text-align:center}
.feat .icon{font-size:26px;margin-bottom:9px}
.feat h3{font-size:14px;font-weight:700;color:#fff;margin-bottom:5px}
.feat p{font-size:12px;color:#666;line-height:1.4}

.cta-wrap{text-align:center;margin-bottom:12px}
.cta-btn{display:inline-flex;align-items:center;gap:10px;background:#2563EB;color:#fff;font-size:17px;font-weight:700;padding:17px 34px;border-radius:14px;transition:background .2s}
.cta-btn:hover{background:#1d4ed8}
.cta-note{font-size:13px;color:#555;text-align:center;margin-bottom:44px}
.cta-note .check{color:#3b82f6}

.cities-section{padding:0 20px 50px}
.section-title{font-size:13px;color:#555;text-align:center;margin-bottom:14px}
.cities-grid{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.city-tag{background:#181818;border:1px solid #2a2a2a;border-radius:999px;padding:7px 15px;font-size:13px;color:#bbb;transition:all .15s}
.city-tag:hover{background:#252525;color:#fff;border-color:#3b82f6}

.faq{padding:0 20px 52px;max-width:680px;margin:0 auto}
.faq-title{font-size:18px;font-weight:700;color:#fff;text-align:center;margin-bottom:18px}
.faq-item{background:#181818;border:1px solid #252525;border-radius:14px;padding:16px 18px;margin-bottom:10px}
.faq-q{font-size:14px;font-weight:600;color:#fff;margin-bottom:6px}
.faq-a{font-size:13px;color:#888;line-height:1.55}

@media(max-width:520px){
  .features{grid-template-columns:1fr}
  .hero{padding:28px 16px 22px}
  .logo-wrap{flex-direction:column;gap:8px}
  .logo-img{width:38px;height:38px}
  .logo-name{text-align:center!important}
  .cta-btn{font-size:15px;padding:15px 24px}
  .lang-bar{padding:10px 16px 0}
}
</style>
</head>
<body>

<div class="lang-bar">
  <button class="lang-btn" data-lang="ru"  onclick="setLang('ru')">RU</button>
  <button class="lang-btn" data-lang="en"  onclick="setLang('en')">EN</button>
  <button class="lang-btn" data-lang="fr"  onclick="setLang('fr')">FR</button>
  <button class="lang-btn" data-lang="he"  onclick="setLang('he')">עב</button>
</div>

<div class="container">

    title:"FlatFinderIL — מצא דירה בישראל תוך 2 דקות",
  },
};

function setLang(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.body.classList.toggle("rtl", t.dir === "rtl");
  document.getElementById("logo-sub").textContent     = t.sub;
  document.getElementById("h1").innerHTML             = t.h1;
  document.getElementById("desc").textContent         = t.desc;
  document.getElementById("cta-text").textContent     = t.cta;
  document.getElementById("cta-note").textContent     = t.note;
  document.getElementById("cities-title").textContent = t.citT;
  document.getElementById("faq-title").textContent    = t.faqT;
  document.getElementById("features").innerHTML = t.feats.map(f=>
    `<div class="feat"><div class="icon">${f.i}</div><h3>${f.h}</h3><p>${f.p}</p></div>`
  ).join("");
  document.getElementById("cities-grid").innerHTML = t.cities.map(c=>
    `<a class="city-tag" href="https://t.me/flatfinderil_bot" target="_blank">${c}</a>`
  ).join("");
  document.getElementById("faq-items").innerHTML = t.faq.map(f=>
    `<div class="faq-item"><div class="faq-q">${f.q}</div><div class="faq-a">${f.a}</div></div>`
  ).join("");
  document.querySelectorAll(".lang-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === lang)
  );
  document.title = t.title;
  const fp = {ru:["Политика конфиденциальности","Условия использования"],en:["Privacy Policy","Terms of Service"],fr:["Politique de confidentialité","Conditions d'utilisation"],he:["מדיניות פרטיות","תנאי שימוש"]};
  const fl = fp[lang]||fp.ru;
  const ep = document.getElementById("footer-privacy"); if(ep) ep.textContent = fl[0];
  const et = document.getElementById("footer-terms");   if(et) et.textContent = fl[1];
  try { localStorage.setItem("ff_lang", lang); } catch(e){}
}

(function(){
  const saved = (() => { try { return localStorage.getItem("ff_lang"); } catch(e){} })();
  const def = document.documentElement.getAttribute("data-default-lang") || "ru";
  setLang(saved && T[saved] ? saved : def);
})();
</script>
