<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d0d0d;color:#fff;min-height:100vh;line-height:1.6}
body.rtl{direction:rtl}
a{color:#3b82f6;text-decoration:none}
a:hover{text-decoration:underline}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #1e1e1e;position:sticky;top:0;background:#0d0d0d;z-index:100}
body.rtl .topbar{flex-direction:row-reverse}
.topbar-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-box{width:36px;height:36px;background:#2563EB;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;flex-shrink:0}
.logo-img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex-shrink:0}
.logo-name{font-size:18px;font-weight:700;color:#fff}
.logo-name span{color:#2563EB}
.lang-bar{display:flex;gap:6px}
.lang-btn{background:#1a1a1a;border:1px solid #444;border-radius:8px;color:#bbb;font-size:12px;font-weight:600;padding:5px 12px;cursor:pointer;transition:all .15s;letter-spacing:.04em;font-family:inherit}
.lang-btn:hover{border-color:#777;color:#fff;background:#252525}
.lang-btn.active{border-color:#2563EB;color:#fff;background:#2563EB}

.content{max-width:720px;margin:0 auto;padding:40px 24px 80px}
.page-title{font-size:28px;font-weight:800;color:#fff;margin-bottom:6px}
.page-date{font-size:13px;color:#555;margin-bottom:40px}

.tabs{display:flex;gap:4px;margin-bottom:32px;border-bottom:1px solid #222;padding-bottom:0}
.tab{padding:10px 20px;font-size:14px;font-weight:600;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px}
.tab:hover{color:#aaa}
.tab.active{color:#fff;border-color:#2563EB}
.tab-content{display:none}
.tab-content.active{display:block}

h2{font-size:18px;font-weight:700;color:#fff;margin:28px 0 10px}
h2:first-child{margin-top:0}
p{font-size:15px;color:#aaa;margin-bottom:14px}
ul{margin:0 0 14px;padding-inline-start:20px}
ul li{font-size:15px;color:#aaa;margin-bottom:6px}
.highlight{background:#181818;border:1px solid #252525;border-radius:12px;padding:16px 18px;margin:16px 0}
.highlight p{margin:0;color:#bbb}

.back-btn{display:inline-flex;align-items:center;gap:6px;color:#3b82f6;font-size:14px;font-weight:500;margin-bottom:32px}
.back-btn:hover{color:#60a5fa}

@media(max-width:600px){
  .content{padding:24px 16px 60px}
  .page-title{font-size:22px}
  .topbar{padding:12px 16px}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{white-space:nowrap;padding:10px 14px;font-size:13px}
}
</style>
</head>

let _activeTab = "privacy";

function showTab(tab) {
  _activeTab = tab;
  document.getElementById("content-privacy").classList.toggle("active", tab === "privacy");
  document.getElementById("content-terms").classList.toggle("active", tab === "terms");
  document.getElementById("tab-privacy").classList.toggle("active", tab === "privacy");
  document.getElementById("tab-terms").classList.toggle("active", tab === "terms");
}

function setLang(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.body.classList.toggle("rtl", t.dir === "rtl");
  document.getElementById("page-title").textContent = t.title;
  document.getElementById("page-date").textContent  = t.date;
  document.getElementById("back-text").textContent  = t.back;
  document.getElementById("tab-privacy-label").textContent = t.tabPrivacy;
  document.getElementById("tab-terms-label").textContent   = t.tabTerms;
  document.getElementById("content-privacy").innerHTML = t.privacy;
  document.getElementById("content-terms").innerHTML   = t.terms;
  document.querySelectorAll(".lang-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === lang)
  );
  document.title = `FlatFinderIL — ${t.tabPrivacy} & ${t.tabTerms}`;
  try { localStorage.setItem("ff_lang", lang); } catch(e){}
}

// Check if URL has ?tab=terms
const urlTab = new URLSearchParams(location.search).get("tab");
if (urlTab === "terms") showTab("terms");

(function(){
  const saved = (() => { try { return localStorage.getItem("ff_lang"); } catch(e){} })();
  const def = document.documentElement.getAttribute("data-default-lang") || "ru";
  setLang(saved && T[saved] ? saved : def);
})();
</script>
